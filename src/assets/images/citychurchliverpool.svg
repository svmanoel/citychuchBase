<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&amp;family=Sacramento&amp;display=swap');
      
      .caps {
        font-family: 'Montserrat', Arial, sans-serif;
        font-weight: 800;
        fill: #26A39B; /* Color verde azulado/teal */
        font-size: 80px;
        letter-spacing: 1px;
      }
      
      .script {
        font-family: 'Sacramento', cursive;
        fill: #3A3A3A; /* Gris oscuro/negro */
        font-size: 85px;
      }
    </style>
  </defs>
  
  <!-- Fondo blanco (opcional, puedes eliminar esta línea si quieres fondo transparente) -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Agrupación para centrar el texto -->
  <g transform="translate(250, 0)">
    <text x="0" y="90" text-anchor="middle" class="caps">CITY</text>
    <text x="0" y="165" text-anchor="middle" class="caps">CHURCH</text>
    
    <!-- El texto de Liverpool se superpone ligeramente hacia arriba como en la original -->
    <text x="0" y="210" text-anchor="middle" class="script">Liverpool</text>
  </g>
</svg>
