<header class="navbar">

  <div class="navbar-container">

    <!-- =========================
         LOGO
    ========================== -->

    <a
      routerLink="/"
      class="logo"
      (click)="closeMenu()">
      <img src="/../../assets/images/citychurch.png" width="75" height="50" alt="Liverpool Citychurch">
    </a>


    <!-- =========================
         HAMBURGER BUTTON
    ========================== -->

    <button
      class="menu-button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Open navigation menu">

      <span></span>
      <span></span>
      <span></span>

    </button>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav
      class="nav-menu"
      [class.open]="menuOpen">

      <!-- HOME -->
      <a routerLink="/" class="nav-link" (click)="closeMenu()">
        HOME
      </a>

      <!-- CONNECT  -->
      <a  routerLink="/connect"  class="nav-link"  (click)="closeMenu()">  
        CONNECT
      </a>

      <!-- SERMONS -->
      <a  routerLink="/services"  class="nav-link"  (click)="closeMenu()">
        SERVICES
      </a>


      <!-- CONTACT -->
      <a routerLink="/contact" class="nav-link" (click)="closeMenu()">
        CONTACT
      </a>

        <!-- SERMONS -->
      <a routerLink="/sermons" class="nav-link" (click)="closeMenu()">
        SERMONS
      </a>


      <!-- ABOUT DROPDOWN -->

      <div class="nav-item">
        <button class="nav-link dropdown-toggle" (click)="toggleDropdown('about')"> 
          ABOUT 
          <span class="chevron" [class.rotate]="activeDropdown === 'about'">
          </span>
        </button>

        <div class="dropdown-menu" [class.show]="activeDropdown === 'about'">
          <a routerLink="/about" (click)="closeMenu()">
            Our Church
          </a>
          <a routerLink="/team" (click)="closeMenu()">
            Our Team
          </a>
          <a routerLink="/beliefs" (click)="closeMenu()">
            What We Believe
          </a>
          <a routerLink="/faqs" (click)="closeMenu()">
           FAQs
          </a>
        </div>
      </div>
        
      <!-- CTA -->
      <a
        routerLink="/visit"
        class="cta-button"
        (click)="closeMenu()">

        PLAN YOUR VISIT

      </a>

    </nav>

  </div>

</header>
